<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Access Denied - MovieBook</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>
        .error-page {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .error-card {
            width: 100%;
            max-width: 520px;
            padding: 45px;
            background: #ffffff;
            border: 1px solid #2d2d36;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .error-code {
            font-size: 64px;
            font-weight: 800;
            color: #dc2626;
            margin-bottom: 8px;
        }

        .error-card h1 {
            font-size: 24px;
            color: #1e1e2f;
            margin-bottom: 12px;
        }

        .error-card p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-actions a {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .error-home {
            background: #4f46e5;
            color: #ffffff;
        }

        .error-login {
            background: #f3f4f6;
            color: #1e1e2f;
            border: 1px solid #2d2d36;
        }
    </style>
</head>
<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="error-page">
    <div class="error-card">
        <div class="error-code">403</div>
        <h1>Access Denied</h1>
        <p>You do not have permission to view this page.
           Please log in with an account that has the required
           role, or return to the home page.</p>
        <div class="error-actions">
            <a th:href="@{/}" class="error-home">Go Home</a>
            <a th:href="@{/login}" class="error-login">Log In</a>
        </div>
    </div>
</div>

</body>
</html>
