<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Movie - Admin</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 30px;
        }

        .form-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #5f6b7a;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: #ffffff;
            color: #1e1e2f;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #e50914;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: #1e1e2f;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #15803d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5f6b7a;
            text-decoration: none;
        }

        .back:hover {
            color: #1e1e2f;
        }

    </style>

</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container">

    <h1><i class="fa-solid fa-film" aria-hidden="true"></i> Add New Movie</h1>

    <div class="form-box">

        <form action="/admin/movies/add"
              method="post">


            <!-- MOVIE TITLE -->

            <div class="field">

                <label>
                    Movie Title
                </label>

                <input type="text"
                       name="title"
                       placeholder="Enter movie title"
                       required>

            </div>


            <!-- GENRE -->

            <div class="field">

                <label>
                    Genre
                </label>

                <input type="text"
                       name="genre"
                       placeholder="Example: Action â€¢ Adventure"
                       required>

            </div>


            <!-- DESCRIPTION -->

            <div class="field">

                <label>
                    Description
                </label>

                <textarea name="description"
                          placeholder="Enter movie description"
                          required></textarea>

            </div>


            <!-- POSTER URL -->

            <div class="field">

                <label>
                    Poster URL
                </label>

                <input type="url"
                       name="posterUrl"
                       placeholder="https://example.com/movie-poster.jpg"
                       required>

            </div>


            <!-- RATING -->

            <div class="field">

                <label>
                    Rating
                </label>

                <input type="number"
                       name="rating"
                       min="0"
                       max="10"
                       step="0.1"
                       placeholder="Example: 8.5"
                       required>

            </div>


            <!-- SUBMIT -->

            <button type="submit"
                    class="submit-btn">

                <i class="fa-solid fa-plus" aria-hidden="true"></i> Add Movie

            </button>

        </form>


        <a href="/admin/movies"
           class="back">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Movie Management

        </a>

    </div>

</div>

<div th:replace="~{footer :: footer}"></div>
</body>

</html>
