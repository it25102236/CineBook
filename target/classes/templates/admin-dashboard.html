<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard - CineBook</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .navbar {
            background: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            padding: 40px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            width: 220px;
        }

        .card h3 {
            margin-top: 0;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #2563eb;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
        }

        .logout {
            color: #ff5555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>


<div class="container">

    <h1>System Admin Dashboard</h1>

    <p>Welcome to CineBook System Management.</p>


    <div class="cards">

        <div class="card">

            <h3><i class="fa-solid fa-users" aria-hidden="true"></i> Users</h3>

            <p>
                Total Users:
                <strong th:text="${#lists.size(users)}">0</strong>
            </p>

            <a href="/admin/users" class="button">
                Manage Users
            </a>

        </div>


        <div class="card">

            <h3><i class="fa-solid fa-lock" aria-hidden="true"></i> Security</h3>

            <p>
                Role-based system access
            </p>

            <a href="/admin/users" class="button">
                Manage Roles
            </a>

        </div>


        <div class="card">

            <h3><i class="fa-solid fa-box-archive" aria-hidden="true"></i> System</h3>

            <p>
                System Status:
                <strong style="color: #22c55e;">
                    ONLINE
                </strong>
            </p>

        </div>

    </div>

</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
