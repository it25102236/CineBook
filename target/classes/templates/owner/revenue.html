<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Revenue Overview - MovieBook</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .manager-page {
            padding: 50px 8%;
            min-height: 70vh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .total-badge {
            background: #ffffff;
            border: 1px solid #2d2d36;
            border-radius: 12px;
            padding: 16px 26px;
            text-align: right;
        }

        .total-badge .label {
            color: #9e9ea8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-badge .value {
            font-size: 26px;
            font-weight: bold;
            color: #ed111c;
        }

        .table-wrap {
            background: #ffffff;
            border: 1px solid #2d2d36;
            border-radius: 14px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #ffffff;
            color: #c7c7cc;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        tbody tr {
            border-top: 1px solid #26262e;
        }

        tbody tr:hover {
            background: #1d1d24;
        }

        .bar-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar-track {
            flex: 1;
            height: 10px;
            border-radius: 6px;
            background: #ffffff;
            overflow: hidden;
            min-width: 100px;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ed111c, #ff5b63);
            border-radius: 6px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

    </style>

</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>

<section class="manager-page">

    <div class="top-bar">
        <h1>Revenue Overview</h1>

        <div class="total-badge">
            <div class="label">Total Revenue</div>
            <div class="value">
                Rs. <span th:text="${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 0, 'POINT')}">0</span>
            </div>
        </div>
    </div>

    <div class="table-wrap">

        <table>

            <thead>
            <tr>
                <th>Movie</th>
                <th>Bookings</th>
                <th style="width:40%;">Revenue Share</th>
                <th>Revenue</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="movie : ${movieRevenues}">

                <td th:text="${movie.title}">Movie Title</td>
                <td th:text="${movie.bookings}">0</td>

                <td>
                    <div class="bar-cell">
                        <div class="bar-track">
                            <div class="bar-fill"
                                 th:style="'width:' + ${(movie.revenue * 100) / maxRevenue} + '%'">
                            </div>
                        </div>
                    </div>
                </td>

                <td>
                    Rs. <span th:text="${#numbers.formatDecimal(movie.revenue, 1, 'COMMA', 0, 'POINT')}">0</span>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(movieRevenues)}">
                <td colspan="4" class="empty">No revenue recorded yet.</td>
            </tr>

            </tbody>

        </table>

    </div>

</section>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
