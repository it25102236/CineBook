<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sales Report - MovieBook</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .manager-page {
            padding: 50px 8%;
            min-height: 70vh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .summary-strip {
            display: flex;
            gap: 20px;
            margin-bottom: 5px;
        }

        .summary-strip .item {
            background: #ffffff;
            border: 1px solid #2d2d36;
            border-radius: 12px;
            padding: 14px 22px;
            text-align: center;
        }

        .summary-strip .item .label {
            color: #9e9ea8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-strip .item .value {
            font-size: 20px;
            font-weight: bold;
            color: #ed111c;
        }

        .table-wrap {
            background: #ffffff;
            border: 1px solid #2d2d36;
            border-radius: 14px;
            overflow: hidden;
            overflow-x: auto;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        th {
            background: #ffffff;
            color: #c7c7cc;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        tbody tr {
            border-top: 1px solid #26262e;
        }

        tbody tr:hover {
            background: #1d1d24;
        }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .status-paid { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-locked { background: rgba(245,158,11,0.15); color: #f5a524; }
        .status-cancelled { background: rgba(237,17,28,0.15); color: #ff6b72; }
        .status-refunded { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .status-other { background: rgba(148,163,184,0.15); color: #94a3b8; }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

    </style>

</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>

<section class="manager-page">

    <div class="top-bar">
        <h1>Sales Report</h1>

        <div class="summary-strip">

            <div class="item">
                <div class="label">Total Sales</div>
                <div class="value" th:text="${totalSales}">0</div>
            </div>

            <div class="item">
                <div class="label">Total Value</div>
                <div class="value">
                    Rs. <span th:text="${#numbers.formatDecimal(totalValue, 1, 'COMMA', 0, 'POINT')}">0</span>
                </div>
            </div>

        </div>
    </div>

    <div class="table-wrap">

        <table>

            <thead>
            <tr>
                <th>Booking ID</th>
                <th>Movie</th>
                <th>Theatre</th>
                <th>Date</th>
                <th>Show Time</th>
                <th>Seat</th>
                <th>Price</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="booking : ${bookings}">

                <td th:text="${booking.id}">1</td>
                <td th:text="${booking.movieTitle}">Movie Title</td>
                <td th:text="${booking.theatre}">Theatre</td>
                <td th:text="${booking.date}">2026-09-20</td>
                <td th:text="${booking.showTime}">7:00 PM</td>
                <td th:text="${booking.seatNumber}">A1</td>

                <td>
                    Rs. <span th:text="${#numbers.formatDecimal(booking.price, 1, 'COMMA', 0, 'POINT')}">0</span>
                </td>

                <td>
                    <span class="status"
                          th:classappend="${
                              booking.status == 'PAID'} ? 'status-paid' :
                              (${booking.status == 'LOCKED'} ? 'status-locked' :
                              (${booking.status == 'CANCELLED'} ? 'status-cancelled' :
                              (${booking.status == 'REFUNDED'} ? 'status-refunded' : 'status-other')))"
                          th:text="${booking.status}">
                        PAID
                    </span>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="8" class="empty">No bookings recorded yet.</td>
            </tr>

            </tbody>

        </table>

    </div>

</section>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
