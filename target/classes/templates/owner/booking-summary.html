<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Summary - MovieBook</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .manager-page {
            padding: 50px 8%;
            min-height: 70vh;
        }

        .manager-header {
            margin-bottom: 35px;
        }

        .manager-header h1 {
            margin-bottom: 10px;
        }

        .manager-header p {
            color: #5f6b7a;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .status-card {
            padding: 22px;
            border-radius: 15px;
            background: #ffffff;
            border: 1px solid #2d2d36;
            text-align: center;
        }

        .status-card .label {
            color: #9e9ea8;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .status-card .value {
            font-size: 28px;
            font-weight: bold;
        }

        .status-card.total .value { color: #1e1e2f; }
        .status-card.paid .value { color: #22c55e; }
        .status-card.locked .value { color: #f5a524; }
        .status-card.cancelled .value { color: #ff6b72; }
        .status-card.refunded .value { color: #94a3b8; }

        .panel {
            padding: 28px;
            border-radius: 15px;
            background: #ffffff;
            border: 1px solid #2d2d36;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 22px;
        }

        .theatre-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-top: 1px solid #26262e;
        }

        .theatre-row:first-of-type {
            border-top: none;
        }

        .theatre-row .name {
            color: #d8d8df;
            font-size: 14px;
        }

        .theatre-row .count {
            background: rgba(237,17,28,0.12);
            color: #ff6b72;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .empty-note {
            color: #77778a;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .status-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .status-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

    </style>

</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>

<section class="manager-page">

    <div class="manager-header">
        <span class="section-label">BUSINESS MANAGEMENT</span>
        <h1>Booking Summary</h1>
        <p>Overview of all customer bookings across the system.</p>
    </div>

    <div class="status-grid">

        <div class="status-card total">
            <div class="label">Total Bookings</div>
            <div class="value" th:text="${totalBookings}">0</div>
        </div>

        <div class="status-card paid">
            <div class="label">Paid</div>
            <div class="value" th:text="${paidCount}">0</div>
        </div>

        <div class="status-card locked">
            <div class="label">Locked / Pending</div>
            <div class="value" th:text="${lockedCount}">0</div>
        </div>

        <div class="status-card cancelled">
            <div class="label">Cancelled</div>
            <div class="value" th:text="${cancelledCount}">0</div>
        </div>

        <div class="status-card refunded">
            <div class="label">Refunded</div>
            <div class="value" th:text="${refundedCount}">0</div>
        </div>

    </div>

    <div class="panel">

        <h2>Bookings by Theatre</h2>

        <div th:each="entry : ${byTheatre}" class="theatre-row">
            <div class="name" th:text="${entry.key}">Theatre Name</div>
            <div class="count" th:text="${entry.value}">0</div>
        </div>

        <p class="empty-note" th:if="${#maps.isEmpty(byTheatre)}">
            No bookings recorded yet.
        </p>

    </div>

</section>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
