<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - MovieBook</title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>
        /* ================= LOGIN PAGE ================= */
        .auth-page {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background: #ffffff;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;

            padding: 45px;

            background: #ffffff;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            box-shadow:
                    0 20px 60px rgba(0,0,0,0.45);
        }

        .auth-logo {
            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 25px;

            color: #1e1e2f;
        }

        .auth-logo span {
            color: #ed111c;
        }

        .auth-card h1 {
            text-align: center;
            color: #1e1e2f;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .auth-subtitle {
            text-align: center;
            color: #9999a2;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .auth-field {
            margin-bottom: 20px;
        }

        .auth-field label {
            display: block;
            color: #d8d8df;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-field input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #1e1e2f;
            outline: none;
            font-size: 14px;
        }
        .auth-field input:focus {
            border-color: #ed111c;
        }

        .auth-button {
            width: 100%;
            height: 52px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #ed111c;
            color: #1e1e2f;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s;
        }
        .auth-button:hover {
            background: #ff1c27;
            transform: translateY(-2px);
        }
        .auth-error {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 7px;
            background: rgba(237,17,28,0.12);
            border: 1px solid rgba(237,17,28,0.3);
            color: #ff6b72;
            font-size: 13px;
            text-align: center;
        }
        .auth-footer {
            margin-top: 25px;
            text-align: center;
            color: #9999a2;
            font-size: 14px;
        }
        .auth-footer a {
            color: #ed111c;
            text-decoration: none;
            font-weight: 700;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .auth-card {
                padding: 30px 22px;
            }
            .auth-card h1 {
                font-size: 28px;
            }

        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<div th:replace="~{navbar :: navbar}"></div>
<!-- ================= LOGIN ================= -->

<section class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fa-solid fa-film" aria-hidden="true"></i> <span>Movie</span>Book

        </div>
        <h1>
            Welcome Back
        </h1>
        <p class="auth-subtitle">
            Login to continue booking your favourite movies.
        </p>
        <!-- ERROR MESSAGE -->
        <div class="auth-error"
             th:if="${error}"
             th:text="${error}">

            Invalid email or password.
        </div>

        <!-- LOGIN FORM -->
        <form th:action="@{/login}"
              th:object="${user}"
              method="post">
                        <input th:if="${redirectTo != null}"
                                     type="hidden"
                                     name="redirect"
                                     th:value="${redirectTo}">
            <!-- EMAIL -->
            <div class="auth-field">
                <label for="email">
                    Email Address
                </label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="Enter your email"
                       maxlength="150"
                       required>

            </div>
            <!-- PASSWORD -->
            <div class="auth-field">

                <label for="password">
                    Password
                </label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       placeholder="Enter your password"
                       maxlength="72"
                       required>

            </div>

            <div class="forgot-password-link">
                <a href="/forgot-password">
                    Forgot Password?
                </a>
            </div>

            <!-- SUBMIT -->
            <button type="submit"
                    class="auth-button">

                Login <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>

            </button>

        </form>


        <!-- SIGN UP LINK -->

        <div class="auth-footer">

            Don't have an account?

            <a href="/signup">
                Create Account
            </a>
        </div>
    </div>
</section>
<!-- ================= FOOTER ================= -->
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
