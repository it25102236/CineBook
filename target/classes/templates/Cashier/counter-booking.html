<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Counter Booking - CineBook</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .navbar {
            background: #ffffff;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #293149;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #e50914;
        }

        .logout {
            color: #ff5555;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 45px auto;
        }

        .booking-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #293149;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #5f6b7a;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            background: #0d1322;
            border: 1px solid #34405c;
            border-radius: 7px;
            color: #1e1e2f;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #e50914;
        }

        .price-box {
            background: rgba(229, 9, 20, 0.10);
            border: 1px solid rgba(229, 9, 20, 0.4);
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }

        .price-box p {
            margin: 5px;
            color: #5f6b7a;
        }

        .price-box h2 {
            margin: 5px;
            color: #e50914;
        }

        .book-btn {
            width: 100%;
            padding: 14px;
            background: #e50914;
            border: none;
            border-radius: 7px;
            color: #1e1e2f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #b80710;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5f6b7a;
            text-decoration: none;
        }

        .back-btn:hover {
            color: #1e1e2f;
        }

        .error-box {
            margin-bottom: 20px;
            background: #3b1115;
            border: 1px solid #ef4444;
            padding: 15px;
            border-radius: 8px;
            color: #ff7777;
            text-align: center;
        }

        .success-box {
            margin-top: 25px;
            background: #102b18;
            border: 1px solid #22c55e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .success-box h3 {
            color: #22c55e;
            margin-top: 0;
        }

        .success-box p {
            color: #ddd;
        }

        .payment-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 25px;
            background: #e50914;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .payment-btn:hover {
            background: #b80710;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .booking-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<div th:replace="~{navbar :: navbar}"></div>


<!-- ================= MAIN ================= -->

<div class="container">

    <div class="booking-card">

        <h1>
            <i class="fa-solid fa-film" aria-hidden="true"></i> Counter Booking
        </h1>

        <p class="subtitle">

            Create a booking for a customer at the cinema counter.

        </p>


        <!-- ================= ERROR MESSAGE ================= -->

        <div class="error-box"
             th:if="${error != null}"
             th:text="${error}">

            Sorry! This seat is already booked.

        </div>


        <!-- ================= BOOKING FORM ================= -->

        <form action="/cashier/counter-booking"
              method="post">


            <!-- ================= MOVIE ================= -->

            <div class="form-group">

                <label for="movieTitle">

                    Movie

                </label>

                <select id="movieTitle"
                        name="movieTitle"
                        required
                        onchange="updateMovieId()">

                    <option value="">
                        Select Movie
                    </option>

                    <option value="Sarthar"
                            data-movie-id="1">

                        Sarthar

                    </option>

                    <option value="Mandaadi"
                            data-movie-id="2">

                        Mandaadi

                    </option>

                    <option value="Immortal"
                            data-movie-id="3">

                        Immortal

                    </option>

                    <option value="DC"
                            data-movie-id="4">

                        DC

                    </option>

                </select>

                <input type="hidden"
                       id="movieId"
                       name="movieId">

            </div>


            <!-- ================= THEATRE ================= -->

            <div class="form-group">

                <label for="theatre">

                    Theatre

                </label>

                <select id="theatre"
                        name="theatre"
                        required>

                    <option value="">
                        Select Theatre
                    </option>

                    <option value="CineBook Cinema Hall 1">
                        CineBook Cinema Hall 1
                    </option>

                    <option value="CineBook Cinema Hall 2">
                        CineBook Cinema Hall 2
                    </option>

                </select>

            </div>


            <!-- ================= DATE ================= -->

            <div class="form-group">

                <label for="date">

                    Date

                </label>

                <input type="date"
                       id="date"
                       name="date"
                      th:attr="min=${minBookingDate}"
                       required>

            </div>


            <!-- ================= SHOW TIME ================= -->

            <div class="form-group">

                <label for="showTime">

                    Show Time

                </label>

                <select id="showTime"
                        name="showTime"
                        required>

                    <option value="">
                        Select Show Time
                    </option>

                    <option value="10:00 AM">
                        10:00 AM
                    </option>

                    <option value="01:30 PM">
                        01:30 PM
                    </option>

                    <option value="04:30 PM">
                        04:30 PM
                    </option>

                    <option value="07:30 PM">
                        07:30 PM
                    </option>

                </select>

            </div>


            <!-- ================= SEAT ================= -->

            <div class="form-group">

                <label for="seatNumber">

                    Seat Number

                </label>

                <input type="text"
                       id="seatNumber"
                       name="seatNumber"
                       placeholder="Example: A1"
                       required>

            </div>


            <!-- ================= PRICE ================= -->

            <div class="price-box">

                <p>
                    Ticket Price
                </p>

                <h2>
                    Rs. 1000
                </h2>

                <input type="hidden"
                       name="price"
                       value="1000">

            </div>


            <!-- ================= SUBMIT ================= -->

            <button type="submit"
                    class="book-btn">

                <i class="fa-solid fa-ticket" aria-hidden="true"></i> Create Booking

            </button>

        </form>


        <!-- ================= SUCCESS ================= -->

        <div class="success-box"
             th:if="${booking != null}">

            <h3>
                Booking Created Successfully!
            </h3>

            <p>

                Seat
                <strong th:text="${booking.seatNumber}">
                    A1
                </strong>

                has been locked.

            </p>

            <p>

                Booking ID:

                <strong th:text="${booking.id}">
                    1
                </strong>

            </p>

            <p>

                Movie:

                <strong th:text="${booking.movieTitle}">
                    Sarthar
                </strong>

            </p>

            <p>

                Amount:

                <strong>
                    Rs.
                    <span th:text="${booking.price}">
                        1000
                    </span>
                </strong>

            </p>


            <!-- PROCEED TO PAYMENT -->

            <a th:href="@{/cashier/payment(
                    bookingId=${booking.id},
                    amount=${booking.price}
                )}"
               class="payment-btn">

                Proceed to Payment

            </a>

        </div>


        <!-- ================= BACK ================= -->

        <a href="/cashier"
           class="back-btn">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Cashier Dashboard

        </a>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

    function updateMovieId() {

        const movieSelect =
            document.getElementById("movieTitle");

        const selectedOption =
            movieSelect.options[movieSelect.selectedIndex];

        const movieId =
            selectedOption.getAttribute("data-movie-id");

        document.getElementById("movieId").value =
            movieId || "";

    }

</script>


<div th:replace="~{footer :: footer}"></div>
</body>

</html>
