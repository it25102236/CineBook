<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Promotions - MovieBook</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        .manager-page {
            padding: 50px 8%;
            min-height: 70vh;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .button {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 8px;
            background: #ed111c;
            color: #1e1e2f;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            opacity: 0.85;
        }

        .table-wrap {
            background: #ffffff;
            border: 1px solid #2d2d36;
            border-radius: 14px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #ffffff;
            color: #c7c7cc;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        tbody tr {
            border-top: 1px solid #26262e;
        }

        tbody tr:hover {
            background: #1d1d2400;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .badge.active {
            background: rgba(34,197,94,0.15);
            color: #22c55e;
        }

        .badge.inactive {
            background: rgba(237,17,28,0.15);
            color: #ff6b72;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .edit-btn {
            background: transparent;
            border: 1px solid #35353d;
            color: #1e1e2f;
        }

        .edit-btn:hover {
            border-color: #ed111c;
            color: #ed111c;
        }

        .delete-btn {
            background: rgba(237,17,28,0.12);
            color: #ff6b72;
        }

        .delete-btn:hover {
            background: rgba(237,17,28,0.22);
        }

        .empty-row td {
            text-align: center;
            padding: 40px;
            color: #777;
        }

    </style>

</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>

<section class="manager-page">

    <div class="top-bar">
        <h1>Manage Promotions</h1>
        <a href="/marketing/promotions/add" class="button">
            + Add Promotion
        </a>
    </div>

    <div class="table-wrap">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="promotion : ${promotions}">

                <td th:text="${promotion.id}">1</td>
                <td th:text="${promotion.title}">Weekend Movie Offer</td>
                <td th:text="${promotion.description}">Special discount</td>
                <td th:text="${promotion.startDate}">2026-09-20</td>
                <td th:text="${promotion.endDate}">2026-09-30</td>

                <td>
                    <span class="badge"
                          th:text="${promotion.status}"
                          th:classappend="${promotion.status == 'ACTIVE'} ? 'active' : 'inactive'">
                        ACTIVE
                    </span>
                </td>

                <td>
                    <div class="actions">

                        <a th:href="@{/marketing/promotions/edit(id=${promotion.id})}"
                           class="action-btn edit-btn">
                            Edit
                        </a>

                        <form th:action="@{/marketing/promotions/delete}"
                              method="post">

                            <input type="hidden"
                                   name="id"
                                   th:value="${promotion.id}">

                            <button type="submit"
                                    class="action-btn delete-btn"
                                    onclick="return confirm('Delete this promotion?')">
                                Delete
                            </button>

                        </form>

                    </div>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(promotions)}"
                class="empty-row">
                <td colspan="7">No promotions available yet.</td>
            </tr>

            </tbody>

        </table>

    </div>

</section>

<div th:replace="~{footer :: footer}"></div>

</body>

</html>
