<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Showtime Management - CineBook</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .navbar {
            background: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: #ff5555;
            text-decoration: none;
        }

        .container {
            padding: 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #2563eb;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .back {
            background: #374151;
        }

        .delete {
            background: #dc2626;
        }

        .edit {
            background: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #ffffff;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-top: 1px solid #293550;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #5f6b7a;
        }

    </style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<div th:replace="~{navbar :: navbar}"></div>


<!-- ================= MAIN ================= -->

<div class="container">


    <div class="top-bar">

        <h1>
            Showtime Management
        </h1>

    </div>


    <div th:if="${success != null or error != null}"
         style="margin-bottom: 20px; padding: 15px; border-radius: 8px; text-align: center;">

        <div th:if="${success != null}"
             style="background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 10px;"
             th:text="${success}">
        </div>

        <div th:if="${error != null}"
             style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px;"
             th:text="${error}">
        </div>

    </div>


    <!-- ================= SHOWTIME TABLE ================= -->

    <table id="showtimesTable">

        <thead>

        <tr>

            <th>
                ID
            </th>

            <th>
                Movie
            </th>

            <th>
                Theatre
            </th>

            <th>
                Date
            </th>

            <th>
                Start Time
            </th>

            <th>
                End Time
            </th>

            <th>
                Total Seats
            </th>

            <th>
                Available Seats
            </th>

            <th>
                Ticket Price
            </th>

            <th>
                Actions
            </th>

        </tr>

        </thead>


        <tbody>


        <!-- ================= SHOWTIME ROW ================= -->

        <tr th:each="showtime : ${showtimes}" th:data-showtime-id="${showtime.id}">


            <td th:text="${showtime.id}" data-field="id">

                1

            </td>


            <td th:text="${showtime.movieTitle}" data-field="movieTitle">

                The Last Journey

            </td>


            <td th:text="${showtime.theatre}" data-field="theatre">

                SLIIT Cinema Hall

            </td>


            <td th:text="${showtime.date}" data-field="date">

                2026-09-20

            </td>


            <td th:text="${showtime.showTime}" data-field="showTime">

                06:30 PM

            </td>


            <td th:text="${showtime.endTime != null and !showtime.endTime.isEmpty() ? showtime.endTime : '-'}"
                data-field="endTime">

                09:00 PM

            </td>


            <td th:text="${showtime.totalSeats}" data-field="totalSeats">

                150

            </td>


            <td th:text="${showtime.availableSeats}" data-field="availableSeats">

                150

            </td>


            <td th:text="${showtime.ticketPrice}" data-field="ticketPrice">

                1000.00

            </td>

            <td>
                <div class="actions">
                    <a class="button edit"
                       th:href="@{/theatre-manager/showtimes/edit(id=${showtime.id})}">
                        Edit
                    </a>
                    <form th:action="@{/theatre-manager/showtimes/delete}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this showtime?');">
                        <input type="hidden" name="id" th:value="${showtime.id}">
                        <button type="submit" class="button delete">Delete</button>
                    </form>
                </div>
            </td>


        </tr>


        <!-- ================= EMPTY MESSAGE ================= -->

        <tr th:if="${#lists.isEmpty(showtimes)}">

            <td colspan="10"
                class="empty">

                No showtimes available.

            </td>

        </tr>


        </tbody>

    </table>


    <br>


    <!-- ================= BACK BUTTON ================= -->

    <a href="/theatre-manager"
       class="button back">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

    </a>


</div>


<div th:replace="~{footer :: footer}"></div>
</body>

</html>
