<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Theatre Management - Admin</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .container {
            width: 900px;
            max-width: 95%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            color: #1e1e2f;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #16a34a;
        }

        .back-btn {
            background: #333;
        }

        .edit-btn {
            background: #ed0712;
        }

        .delete-btn {
            background: #dc2626;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: #14532d;
            color: #86efac;
        }

        .error {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .table-box {
            background: #ffffff;
            border-radius: 10px;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: #e50914;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions form {
            display: inline;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #5f6b7a;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
        }

    </style>

</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container">

    <h1><i class="fa-solid fa-building" aria-hidden="true"></i> Theatre Management</h1>


    <!-- TOP BAR -->

    <div class="top-bar">

        <a href="/admin/theatres/add"
           class="btn add-btn">

            + Add New Theatre

        </a>

        <a href="/admin"
           class="btn back-btn">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Admin Dashboard

        </a>

    </div>


    <!-- SUCCESS MESSAGE -->

    <div th:if="${success}"
         class="message success"
         th:text="${success}">

    </div>


    <!-- ERROR MESSAGE -->

    <div th:if="${error}"
         class="message error"
         th:text="${error}">

    </div>


    <!-- THEATRE TABLE -->

    <div class="table-box">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Theatre Name</th>

                <th>Location</th>

                <th>Total Seats</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="theatre : ${theatres}">

                <!-- ID -->

                <td th:text="${theatre.id}"></td>


                <!-- NAME -->

                <td th:text="${theatre.name}"></td>


                <!-- LOCATION -->

                <td th:text="${theatre.location}"></td>


                <!-- TOTAL SEATS -->

                <td th:text="${theatre.totalSeats}"></td>


                <!-- ACTION -->

                <td>

                    <div class="actions">

                        <!-- EDIT -->

                        <a th:href="@{/admin/theatres/edit(id=${theatre.id})}"
                           class="btn edit-btn">

                            Edit

                        </a>


                        <!-- DELETE -->

                        <form action="/admin/theatres/delete"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this theatre?');">

                            <input type="hidden"
                                   name="id"
                                   th:value="${theatre.id}">

                            <button type="submit"
                                    class="btn delete-btn">

                                Delete

                            </button>

                        </form>

                    </div>

                </td>

            </tr>


            <!-- NO THEATRES -->

            <tr th:if="${#lists.isEmpty(theatres)}">

                <td colspan="5"
                    class="empty">

                    No theatres available.

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <a href="/"
           class="btn back-btn">

            <i class="fa-solid fa-house" aria-hidden="true"></i> Home

        </a>

    </div>

</div>

<div th:replace="~{footer :: footer}"></div>
</body>

</html>
