<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>User Management</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .container {
            width: 1100px;
            max-width: 92%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #5f6b7a;
            margin-bottom: 25px;
        }

        .top-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .add-btn {
            display: inline-block;
            padding: 11px 18px;
            background: #e50914;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .add-btn:hover {
            opacity: 0.85;
        }

        .success {
            background: #102b18;
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
        }

        .table-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #e50914;
            color: #1e1e2f;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            color: #ddd;
        }

        tr:hover {
            background: #252525;
        }

        .role {
            color: #22c55e;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .edit-btn {
            display: inline-block;
            padding: 8px 13px;
            background: #ed0712;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .edit-btn:hover {
            background: #b8050e;
        }

        .delete-btn {
            padding: 8px 13px;
            background: #991b1b;
            color: #1e1e2f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            color: #5f6b7a;
            padding: 30px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #444;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
        }

    </style>

</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container">

    <h1><i class="fa-solid fa-users" aria-hidden="true"></i> User Management</h1>

    <p class="subtitle">
        Manage registered users in the CineBook system
    </p>


    <!-- SUCCESS MESSAGE -->

    <div th:if="${success}"
         class="success"
         th:text="${success}">
    </div>


    <!-- ADD USER BUTTON -->

    <div class="top-actions">

        <a href="/admin/users/add"
           class="add-btn">

            <i class="fa-solid fa-plus" aria-hidden="true"></i> Add New User

        </a>

    </div>


    <!-- USERS TABLE -->

    <div class="table-box">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Role</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.id}">
                    1
                </td>

                <td th:text="${user.name}">
                    User Name
                </td>

                <td th:text="${user.email}">
                    user@email.com
                </td>

                <td class="role"
                    th:text="${user.role != null ? user.role : 'CUSTOMER'}">

                    CUSTOMER

                </td>

                <td>

                    <div class="actions">

                        <!-- EDIT -->

                        <a th:href="@{/admin/users/edit(id=${user.id})}"
                           class="edit-btn">

                            <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> Edit

                        </a>


                        <!-- DELETE -->

                        <form th:action="@{/admin/users/delete}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this user?');">

                            <input type="hidden"
                                   name="id"
                                   th:value="${user.id}">

                            <button type="submit"
                                    class="delete-btn">

                                <i class="fa-solid fa-trash" aria-hidden="true"></i> Delete

                            </button>

                        </form>

                    </div>

                </td>

            </tr>


            <tr th:if="${#lists.isEmpty(users)}">

                <td colspan="5"
                    class="empty">

                    No users found.

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <a href="/admin"
           class="btn">

            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Admin Dashboard

        </a>

    </div>

</div>

<div th:replace="~{footer :: footer}"></div>
</body>

</html>
