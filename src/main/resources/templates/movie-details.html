<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Movie Details</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .movie-container {
            width: 85%;
            max-width: 1000px;
            margin: 50px auto;
        }

        .movie-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .movie-card h1 {
            margin-bottom: 20px;
        }

        .movie-info {
            margin-bottom: 15px;
        }

        .movie-info strong {
            display: inline-block;
            width: 130px;
        }

        .button {
            display: inline-block;
            padding: 11px 20px;
            margin-top: 20px;
            background: #222;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-button {
            background: #666;
            margin-left: 10px;
        }
    </style>
</head>

<body>


<!-- ================= NAVBAR ================= -->

<div th:replace="~{navbar :: navbar}"></div>


<div class="movie-container">

    <div class="movie-card">

        <h1 th:text="${movie.title}">
            Movie Title
        </h1>

        <div class="movie-info">
            <strong>Movie ID:</strong>
            <span th:text="${movie.id}">
                1
            </span>
        </div>

        <div class="movie-info">
            <strong>Title:</strong>
            <span th:text="${movie.title}">
                Movie Title
            </span>
        </div>

        <a th:href="@{/movie-showtimes(movieId=${movie.id})}"
           class="button">
            View Showtimes
        </a>

        <a href="/movies"
           class="button back-button">
            Back to Movies
        </a>

    </div>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
