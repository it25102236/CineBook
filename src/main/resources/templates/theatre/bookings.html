<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Bookings - CineBook</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .navbar {
            background: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: #ff5555;
            text-decoration: none;
        }

        .container {
            padding: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #ffffff;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-top: 1px solid #293550;
        }

        .status {
            font-weight: bold;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #374151;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 25px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #5f6b7a;
        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<div th:replace="~{navbar :: navbar}"></div>


<!-- MAIN -->

<div class="container">

    <h1><i class="fa-solid fa-ticket" aria-hidden="true"></i> Customer Bookings</h1>

    <p>
        View all bookings made in the CineBook system.
    </p>


    <!-- BOOKINGS TABLE -->

    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Movie</th>

            <th>Theatre</th>

            <th>Date</th>

            <th>Show Time</th>

            <th>Seat</th>

            <th>Price</th>

            <th>Status</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="booking : ${bookings}">

            <td th:text="${booking.id}">
                1
            </td>

            <td th:text="${booking.movieTitle}">
                The Last Journey
            </td>

            <td th:text="${booking.theatre}">
                SLIIT Cinema Hall
            </td>

            <td th:text="${booking.date}">
                2026-09-20
            </td>

            <td th:text="${booking.showTime}">
                06:30 PM
            </td>

            <td th:text="${booking.seatNumber}">
                A1
            </td>

            <td>
                Rs.
                <span th:text="${booking.price}">
                    1000
                </span>
            </td>

            <td class="status"
                th:text="${booking.status}">
                PAID
            </td>

        </tr>


        <!-- EMPTY MESSAGE -->

        <tr th:if="${#lists.isEmpty(bookings)}">

            <td colspan="8"
                class="empty">

                No bookings available.

            </td>

        </tr>

        </tbody>

    </table>


    <a href="/theatre-manager"
       class="button">

        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard

    </a>

</div>

<div th:replace="~{footer :: footer}"></div>
</body>

</html>
