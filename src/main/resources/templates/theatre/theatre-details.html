<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Theatre Management - CineBook</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e1e2f;
        }

        .navbar {
            background: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: #ff5555;
            text-decoration: none;
        }

        .container {
            padding: 40px;
        }

        .management-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .management-header h1 {
            margin: 0;
        }

        .table-card {
            background: #ffffff;
            border: 1px solid #293550;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #293550;
        }

        th {
            color: #60a5fa;
            font-weight: bold;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            background: #374151;
            color: #1e1e2f;
            text-decoration: none;
            border-radius: 6px;
            border: 0;
            font: inherit;
            cursor: pointer;
        }

        .add-button {
            background: #16a34a;
        }

        .edit-button {
            background: #ed111c;
        }

        .delete-button {
            background: #dc2626;
        }

        .actions form {
            margin: 0;
        }

        .empty {
            padding: 30px;
            color: #5f6b7a;
            text-align: center;
        }

        .back-button {
            margin-top: 24px;
        }

        .form-card {
            display: none;
            background: #ffffff;
            border: 1px solid #293550;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .form-card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-row .field label {
            display: block;
            color: #5f6b7a;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-row .field input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #293550;
            border-radius: 6px;
            background: #ffffff;
            color: #1e1e2f;
        }

        .form-row .field input:focus {
            outline: none;
            border-color: #16a34a;
        }

        .form-row .field select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #293550;
            border-radius: 6px;
            background: #ffffff;
            color: #1e1e2f;
        }

        .form-row .field select:focus {
            outline: none;
            border-color: #16a34a;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.3px;
        }

        .status-available {
            background: #0d3a1f;
            color: #4ade80;
        }

        .status-maintenance {
            background: #4a1414;
            color: #f87171;
        }

        .error-message {
            background: #3a1010;
            border: 1px solid #e50914;
            color: #ff6b6b;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        @media (max-width: 800px) {

            .form-row {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .management-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .container {
                padding: 20px;
            }

            .navbar {
                padding: 20px;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<div th:replace="~{navbar :: navbar}"></div>


<!-- MAIN -->

<div class="container">

    <div class="management-header">
        <h1><i class="fa-solid fa-building" aria-hidden="true"></i> Theatre Management</h1>
        <button type="button"
                id="showAddTheatreButton"
                class="button add-button"
                onclick="toggleAddTheatreForm(true);">+ Add New Theatre</button>
    </div>


    <!-- ================= ERROR MESSAGE ================= -->

    <div th:if="${error}" class="error-message">
        <span th:text="${error}">Error message</span>
    </div>


    <!-- ================= ADD THEATRE FORM (shown only after clicking the button) ================= -->

    <div class="form-card"
         id="addTheatreForm"
         th:style="${addTheatreFormVisible} ? 'display: block;' : 'display: none;'">

        <h2><i class="fa-solid fa-plus" aria-hidden="true"></i> New Theatre</h2>

        <form th:action="@{/theatre-manager/theatres/add}"
              method="post"
              id="addTheatreFormElement">

            <div class="form-row">

                <div class="field">
                    <label for="newTheatreName">Theatre Name</label>
                    <input type="text"
                           id="newTheatreName"
                           name="name"
                           placeholder="Enter theatre name"
                           required
                           minlength="2"
                           maxlength="100"
                           pattern="^[a-zA-Z0-9\s\-'.&amp;]+$"
                           title="Only letters, numbers, spaces, hyphens, apostrophes, periods, and &amp; are allowed."
                           th:value="${newTheatre != null && newTheatre.name != null ? newTheatre.name : ''}">
                </div>

                <div class="field">
                    <label for="newTheatreLocation">Location</label>
                    <input type="text"
                           id="newTheatreLocation"
                           name="location"
                           placeholder="Enter theatre location"
                           required
                           minlength="2"
                           maxlength="200"
                           th:value="${newTheatre != null && newTheatre.location != null ? newTheatre.location : ''}">
                </div>

                <div class="field">
                    <label for="newTheatreSeats">Capacity</label>
                    <input type="number"
                           id="newTheatreSeats"
                           name="totalSeats"
                           min="1"
                           max="500"
                           step="1"
                           inputmode="numeric"
                           pattern="\d+"
                           title="Enter a whole number between 1 and 500."
                           placeholder="Example: 150"
                           required
                           th:value="${newTheatre != null && newTheatre.totalSeats > 0 ? newTheatre.totalSeats : ''}">
                </div>

            </div>

            <div class="form-row">

                <div class="field">
                    <label for="newTheatreStatus">Status</label>
                    <select id="newTheatreStatus"
                            name="status"
                            required>
                        <option value="AVAILABLE"
                                th:selected="${newTheatre == null || newTheatre.status == null || newTheatre.status == 'AVAILABLE'}">AVAILABLE</option>
                        <option value="MAINTENANCE"
                                th:selected="${newTheatre != null && newTheatre.status == 'MAINTENANCE'}">MAINTENANCE</option>
                    </select>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="button add-button">
                    <i class="fa-solid fa-check" aria-hidden="true"></i> Add Theatre
                </button>
                <button type="button"
                        class="button"
                        onclick="toggleAddTheatreForm(false);">
                    Cancel
                </button>
            </div>

        </form>

    </div>


    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Theatre Name</th>
                <th>Location</th>
                <th>Capacity</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="theatre : ${theatres}">
                <td th:text="${theatre.id}">1</td>
                <td th:text="${theatre.name}">Theatre Name</td>
                <td th:text="${theatre.location}">Location</td>
                <td th:text="${theatre.totalSeats}">0</td>
                <td>
                    <span th:if="${theatre.isUnderMaintenance()}"
                          class="status-badge status-maintenance">MAINTENANCE</span>
                    <span th:unless="${theatre.isUnderMaintenance()}"
                          class="status-badge status-available">AVAILABLE</span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{/theatre-manager/theatres/edit(id=${theatre.id})}"
                           class="button edit-button">Edit</a>
                        <form action="/theatre-manager/theatres/delete"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this theatre?');">
                            <input type="hidden" name="id" th:value="${theatre.id}">
                            <button type="submit" class="button delete-button">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(theatres)}">
                <td colspan="6" class="empty">No theatres available.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/theatre-manager" class="button back-button"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Dashboard</a>

</div>

<script>
    function toggleAddTheatreForm(show) {
        var form = document.getElementById('addTheatreForm');
        if (form) {
            form.style.display = show ? 'block' : 'none';
        }
        if (show) {
            var firstInput = document.getElementById('newTheatreName');
            if (firstInput) {
                firstInput.focus();
            }
        }
    }
</script>

<div th:replace="~{footer :: footer}"></div>
</body>

</html>
