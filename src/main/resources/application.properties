spring.application.name=MovieBookingSystem

# ================= DATABASE CONFIGURATION (H2 - embedded, no external DB server) =================
# The app now uses an embedded H2 database (in-memory).
# No external SQL Server installation is required to run the app.

spring.datasource.url=jdbc:h2:mem:cinebook_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= EMAIL CONFIGURATION =================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=antonysinthursan@gmail.com
spring.mail.password=diuqgzvcsmbpdytl

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================= SMS OTP CONFIGURATION =================
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.sms.country-code=${SMS_DEFAULT_COUNTRY_CODE:+94}

# ================= CUSTOMER SUPPORT =================
# Window (minutes) within which an identical ticket is treated as a duplicate
app.support.duplicate-window-minutes=5
# Directory (outside public static resources) where ticket attachments are stored
app.support.attachment-dir=./support-attachments

# ================= MULTIPART / ATTACHMENT LIMITS =================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
